<html lang="id">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, sans-serif;
    color: #fff;
    background: #2a0e02 url("assets/og-bg.jpg") center / cover;
    position: relative;
  }
  /* Smoke darkening on the text side so the headline reads at thumbnail size. */
  body::before {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(26,6,0,.82) 0%, rgba(26,6,0,.55) 45%, rgba(26,6,0,0) 75%),
      linear-gradient(0deg, rgba(26,6,0,.6) 0%, rgba(26,6,0,0) 40%);
  }
  main { position: relative; z-index: 1; height: 100%; padding: 60px 72px; display: flex; flex-direction: column; }
  .eyebrow { font-size: 24px; font-weight: 700; letter-spacing: .14em; color: #ffb347; }
  h1 {
    margin-top: 36px;
    font-size: 116px; font-weight: 900; line-height: .95; letter-spacing: -.045em;
    text-shadow: -6px 0 rgba(255, 42, 18, .9), 6px 0 rgba(255, 194, 58, .9);
  }
  .sub { margin-top: 22px; font-size: 48px; font-weight: 700; letter-spacing: -.025em; color: #ffe2b0; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
  .stat { font-size: 26px; font-weight: 600; color: #ffe2b0; }
  .stat b { font-weight: 900; font-size: 34px; color: #fff; }
  .url {
    font-size: 26px; font-weight: 700; color: #1b0700;
    background: #fff; padding: 14px 26px; border-radius: 999px;
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">#LAWANKARHUTLA</p>
  <h1>Ini bukan<br>filter.</h1>
  <p class="sub">Ini langit Palangka Raya.</p>
  <div class="foot">
    <p class="stat">ISPU sempat tembus <b>1.294</b></p>
    <p class="url">lawankarhutla.pages.dev</p>
  </div>
</main>
</body>
</html>
